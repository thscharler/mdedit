[package]
name = "mdedit"
version = "2.0.1"
edition = "2021"
description = "markdown editor with ratatui and rat-salsa"
license = "MIT/Apache-2.0"
repository = "https://github.com/thscharler/mdedit"
authors = ["thscharler <thscharler@gmail.com>"]
readme = "readme.md"
keywords = ["ratatui", "input", "event-loop"]
categories = ["text-editors"]
exclude = [".idea/*", ".gitignore", "mdedit.gif"]

[features]
default = []
wgpu = ["rat-salsa-wgpu"]
term = ["rat-salsa"]

[dependencies]
cli-clipboard = "0.4"
anyhow = "1.0"
log = "0.4"
rust-ini = "0.21"
fern = "0.7"
dirs = "7.0"
glob = "0.3"
ignore = "0.4"
pulldown-cmark = "0.13"
toml = "0.8"
crossbeam = "0.8"
sys-locale = "0.3"
try_as = "0.1"
winit = { version = "0.30", optional = true }

ratatui = { version = "0.30", features = ["crossterm"] }

rat-salsa = { version = "4.0", features = [], optional = true }
rat-salsa-wgpu = { version = "1.0", features = [], optional = true }
rat-widget = { version = "3.3", features = ["user_directories"] }
rat-theme4 = { version = "4.5" }
rat-markdown = { version = "0.7" }

[[bin]]
name = "mdedit-wgpu"
path = "src/main.rs"
required-features = ["wgpu"]

[[bin]]
name = "mdedit"
path = "src/main.rs"
required-features = ["term"]